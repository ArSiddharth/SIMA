<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Secret Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ========= Base Reset ========= */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a; /* slate-900 */
      /* Gradient background */
      background:
        radial-gradient(1200px 600px at 10% 10%, #e0f2fe 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 20%, #f1f5f9 0%, transparent 60%),
        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    /* ========= Card (Glass) ========= */
    .card {
      width: min(420px, 92vw);
      backdrop-filter: blur(8px) saturate(1.2);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(148,163,184,0.25);
      box-shadow: 0 30px 60px rgba(2, 8, 23, 0.08), 0 2px 8px rgba(2, 8, 23, 0.06);
      border-radius: 16px;
      padding: 1.25rem;
      animation: rise-in 600ms ease-out both;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* ========= Header ========= */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .badge {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(145deg, #22d3ee, #3b82f6);
      box-shadow: inset 0 -2px 6px rgba(255,255,255,0.35), 0 6px 16px rgba(37,99,235,0.35);
      display: grid; place-items: center;
      color: #fff; font-weight: 700;
      letter-spacing: 0.5px;
      transform: rotate(-6deg);
      animation: badge-pop 500ms ease-out 150ms both;
    }
    @keyframes badge-pop {
      from { transform: rotate(-12deg) scale(0.9); }
      to   { transform: rotate(-6deg)  scale(1); }
    }
    .title {
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 0.4px;
    }  

    /* ========= Form ========= */
    form {
      margin-top: 0.75rem;
      display: grid;
      gap: 1rem;
    }

    .field {
      position: relative;
    }

    /* Floating label pattern */
    .input {
      width: 100%;
      padding: 0.95rem 0.9rem 0.95rem 0.9rem;
      border: 1.5px solid #cbd5e1; /* slate-300 */
      border-radius: 12px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      font-size: 1rem;
    }
    .input::placeholder { color: transparent; } /* hide placeholder for label */
    .label {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      padding: 0 6px;
      background: #ffffff;
      color: #64748b; /* slate-500 */
      pointer-events: none;
      transition: all 160ms ease;
    }

    /* Focused / has value = lift label */
    .input:focus + .label,
    .input:not(:placeholder-shown) + .label {
      top: 0; transform: translateY(-50%) scale(0.9);
      color: #2563eb; /* blue-600 */
    }

    /* Focus ring */
    .input:focus {
      border-color: #60a5fa; /* blue-400 */
      box-shadow: 0 0 0 4px rgba(96,165,250,0.22);
      background: #f8fafc;
    }

    /* Invalid state (HTML5 validation) */
    .input:invalid:not(:focus):not(:placeholder-shown) {
      border-color: #ef4444;
      box-shadow: 0 0 0 4px rgba(239,68,68,0.12);
    }

    /* Underline progress effect using ::after */
    .field::after {
      content: "";
      position: absolute;
      left: 12px; right: 12px; bottom: 6px;
      height: 2px;
      background: linear-gradient(90deg, #22d3ee 0%, #3b82f6 50%, #6366f1 100%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 220ms ease;
      opacity: 0.75;
    }
    .input:focus ~ .underline { transform: scaleX(1); }
    /* helper element to trigger underline */
    .underline { position:absolute; inset:0; pointer-events:none; }

    /* ========= Button ========= */
    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #fff;
      background:
        linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      box-shadow:
        0 10px 22px rgba(37, 99, 235, 0.35),
        0 2px 6px rgba(37, 99, 235, 0.18);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 160ms ease, filter 160ms ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      filter: saturate(1.15);
      box-shadow:
        0 14px 28px rgba(37, 99, 235, 0.38),
        0 3px 8px rgba(37, 99, 235, 0.20);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow:
        0 8px 18px rgba(37,99,235,0.30),
        0 2px 6px rgba(37,99,235,0.18);
    }

    /* ========= Footer / Hint ========= */
    .hint {
      font-size: 0.85rem;
      color: #475569;
      text-align: center;
      margin-top: 0.5rem;
    }

    /* ========= Small screen tweaks ========= */
    @media (max-width: 380px) {
      .card { padding: 1rem; border-radius: 14px; }
      .badge { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>

  <main class="card" role="main" aria-label="Secret Login Card">
    <!-- Header -->
    <div class="header">
      <div class="badge" aria-hidden="true">SL</div>
      <div>
        <div class="title">Secret Login</div>
      </div>
    </div>

    <form method="POST" action="">
      <!-- Username field -->
      <div class="field">
        <input
          class="input"
          type="text"
          name="username"
          placeholder="Username"
          required
          aria-label="Enter Username"
          autocomplete="username"
        />
        <span class="label">Enter Username</span>
        <!-- helper element to trigger underline on focus -->
        <span class="underline" aria-hidden="true"></span>
      </div>

      <!-- Submit -->
      <button class="btn" type="submit">Login</button>

      <p class="hint">Note: This is a secret login page </p>
    </form>
  </main>

</body>
</html>
